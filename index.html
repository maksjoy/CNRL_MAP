<style>
  :root{
    --bg: #0B0D10;
    --panel: #15181D;
    --panel-2: #1D2127;
    --line: #262B33;
    --amber: #F5A623;
    --amber-dim: #8A6A2E;
    --green: #3DD68C;
    --text: #EDEFF2;
    --muted: #8A929E;
    --mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  html[data-theme="light"]{
    --bg: #EEF1F4;
    --panel: #FFFFFF;
    --panel-2: #F7F8FA;
    --line: #DCE1E6;
    --amber: #C97A12;
    --amber-dim: #B08A4E;
    --green: #1E9C64;
    --text: #171A1E;
    --muted: #5B6470;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--sans);
    overscroll-behavior-y: contain;
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--amber-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .eyebrow .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    margin-right: 6px;
    box-shadow: 0 0 0 0 rgba(61,214,140,0.6);
  }
  .eyebrow .dot.on {
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(61,214,140,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(61,214,140,0); }
    100% { box-shadow: 0 0 0 0 rgba(61,214,140,0); }
  }
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--amber); }
  .header-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { transform: scale(0.92); }

  .update-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--amber);
    color: #0B0D10;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .update-banner.show { display: flex; }
  .update-banner button {
    flex-shrink: 0;
    background: #0B0D10;
    color: var(--amber);
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    font-family: var(--mono);
  }
  .update-banner button:active { transform: scale(0.95); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
  }
  .modal-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .modal-body {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
  }
  .modal-body .step {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .modal-body .step-num {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--amber);
    color: #0B0D10;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-body .icon-inline {
    font-size: 15px;
  }
  .modal-close {
    margin-top: 16px;
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    background: var(--amber);
    color: #0B0D10;
    border: none;
    font-weight: 700;
    font-size: 15px;
  }

  .search-wrap {
    padding: 14px 16px 10px;
    flex-shrink: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .readout {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .readout b { color: var(--amber); font-weight: 700; }
  .input-row {
    position: relative;
    display: flex;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 4px 0 14px;
  }
  .input-row:focus-within {
    border-color: var(--amber-dim);
  }
  #search {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 14px 0;
    text-transform: uppercase;
  }
  #search::placeholder {
    color: var(--muted);
    font-weight: 500;
    text-transform: none;
    letter-spacing: normal;
  }
  #clear {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: none;
  }
  #clear.show { display: block; }

  .loc-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  #locBtn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #locBtn.active { color: var(--green); border-color: rgba(61,214,140,0.35); }
  #locStatus { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .favorite-btn{width:38px;height:38px;flex-shrink:0;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--muted);font-size:20px;cursor:pointer}
  .favorite-btn.active{color:var(--amber);border-color:var(--amber-dim)}
  #favToggle{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 10px}
  #favToggle.active{color:var(--amber);border-color:var(--amber-dim)}

  main {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px 100px;
    -webkit-overflow-scrolling: touch;
  }
  .count-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 12px 2px 8px;
  }
  .results { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: rise 0.18s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-main { flex: 1; min-width: 0; }
  .card-name {
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-name mark { background: none; color: var(--amber); }
  .card-info {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-dist {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--green);
    margin-top: 4px;
  }
  .go-btn {
    flex-shrink: 0;
    width: 52px;
    height: 52px;
    border-radius: 10px;
    background: var(--amber);
    color: #0B0D10;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 22px;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .go-btn:active { transform: scale(0.94); }
  .go-btn:disabled { opacity: 0.7; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty .big { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
  .empty .hint { font-family: var(--mono); font-size: 12px; margin-top: 8px; color: var(--amber-dim); }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    text-align: center;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--muted);
    pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">
    <span><span class="dot" id="gpsDot"></span>WABASCA / PELICAN LAKE</span>
    <span id="wellCount">LOADING SITES</span>
  </div>
  <div class="title-row">
    <h1><span>CNRL</span> map</h1>
    <div class="header-actions">
      <button id="themeBtn" class="icon-btn" title="Toggle day/night">🌙</button>
      <button id="installBtn" class="icon-btn" title="Add to home screen">⤓</button>
    </div>
  </div>
</header>

<div id="updateBanner" class="update-banner">
  <span>🔄 A new version of CNRL map is available</span>
  <button id="updateBtn">Update now</button>
</div>

<div id="installModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">Add CNRL map to your home screen</div>
    <div id="installBody" class="modal-body"></div>
    <button id="installClose" class="modal-close">Got it</button>
  </div>
</div>

<div class="search-wrap">
  <div class="readout" id="readout">Type a well ID or asset name — e.g. <b>CB20</b></div>
  <div class="input-row">
    <input id="search" type="text" placeholder="CB20, 13-11, ETV #4..." autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="clear">✕</button>
  </div>
  <div class="loc-row">
    <button id="locBtn">📍 Sort by distance</button>
    <button id="favToggle" type="button">☆ SAVED <span id="favCount">0</span></button>
    <span id="locStatus"></span>
  </div>
</div>

<main>
  <div id="content"></div>
</main>

<footer><span id="footerSiteCount">SITES</span> · WORKS OFFLINE · TAP TO ROUTE</footer>

<script>

document.getElementById('wellCount').textContent = `${WELLS.length} SITES`;
document.getElementById('footerSiteCount').textContent = `${WELLS.length} SITES`;

let userLoc = null;
let watchId = null;

const searchEl = document.getElementById('search');
const clearEl = document.getElementById('clear');
const contentEl = document.getElementById('content');
const readoutEl = document.getElementById('readout');
const locBtn = document.getElementById('locBtn');
const locStatus = document.getElementById('locStatus');
const gpsDot = document.getElementById('gpsDot');
const favToggle = document.getElementById('favToggle');
let favorites = new Set();
let favoritesOnly = false;
try { const saved = JSON.parse(localStorage.getItem('cnrl-map-favorites') || '[]'); if (Array.isArray(saved)) favorites = new Set(saved); } catch (e) {}
function isFavorite(name) { return favorites.has(name); }
function saveFavorites() { try { localStorage.setItem('cnrl-map-favorites', JSON.stringify(Array.from(favorites))); } catch (e) {} document.getElementById('favCount').textContent = String(favorites.size); favToggle.firstChild.textContent = favoritesOnly ? '★ SAVED ' : '☆ SAVED '; }
function toggleFavorite(name) { if (favorites.has(name)) favorites.delete(name); else favorites.add(name); saveFavorites(); render(); }
saveFavorites();
favToggle.addEventListener('click', () => { favoritesOnly = !favoritesOnly; favToggle.classList.toggle('active', favoritesOnly); favToggle.firstChild.textContent = favoritesOnly ? '★ SAVED ' : '☆ SAVED '; render(); });

function normalize(str) {
  return str
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '');
}
function stripLeadingZeros(str) {
  // strip leading zeros within digit runs, e.g. cb020 -> cb20
  return str.replace(/0+(\d)/g, '$1');
}
WELLS.forEach(w => {
  const n = normalize(w.name);
  w._norm = n;
  w._normNoZero = stripLeadingZeros(n);
});

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function mapsUrl(lat, lng, origin) {
  let url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
  if (origin) url += `&origin=${origin.lat},${origin.lng}`;
  return url;
}

function isIOSDevice() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

// Opens the native Google Maps app directly (not the website).
// iOS: custom URL scheme opens the Google Maps app if installed.
// Android: the standard https link hands off to the Google Maps app.
// No automatic fallback to the web version — that was causing both to open
// at once on some phones, since iOS doesn't reliably report "I left the page"
// in time (sometimes it shows an "Open in Google Maps?" confirmation first).
function openGoogleMapsRoute(lat, lng, origin) {
  if (isIOSDevice()) {
    let appUrl = `comgooglemaps://?daddr=${lat},${lng}&directionsmode=driving`;
    if (origin) appUrl += `&saddr=${origin.lat},${origin.lng}`;
    window.location.href = appUrl;
  } else {
    window.location.href = mapsUrl(lat, lng, origin);
  }
}

function highlight(name, query) {
  if (!query) return escapeHtml(name);
  const idx = name.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escapeHtml(name);
  const before = escapeHtml(name.slice(0, idx));
  const match = escapeHtml(name.slice(idx, idx + query.length));
  const after = escapeHtml(name.slice(idx + query.length));
  return `${before}<mark>${match}</mark>${after}`;
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderCard(w, query) {
  let distHtml = '';
  if (userLoc) {
    const d = haversine(userLoc.lat, userLoc.lng, w.lat, w.lng);
    distHtml = `<div class="card-dist">${d < 1 ? Math.round(d*1000)+' m' : d.toFixed(1)+' km'} away</div>`;
  }
  const infoHtml = w.info ? `<div class="card-info">${escapeHtml(w.info)}</div>` : '';
  return `
    <div class="card">
      <div class="card-main">
        <div class="card-name">${highlight(w.name, query)}</div>
        ${infoHtml}
        ${distHtml}
      </div>
      <button class="favorite-btn ${isFavorite(w.name) ? "active" : ""}" data-favorite="${escapeHtml(w.name)}" aria-label="Save location">${isFavorite(w.name) ? "★" : "☆"}</button>
      <button class="go-btn" data-lat="${w.lat}" data-lng="${w.lng}">➜</button>
    </div>
  `;
}

// Route from the user's exact current position, fetched fresh at tap time.
// NOTE: we navigate via location.href (not window.open) because iOS silently
// blocks window.open() when it fires asynchronously after a geolocation callback.
function routeFromHere(btn) {
  const lat = parseFloat(btn.dataset.lat);
  const lng = parseFloat(btn.dataset.lng);
  const original = btn.textContent;

  if (!navigator.geolocation) {
    openGoogleMapsRoute(lat, lng);
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳';

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const origin = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      openGoogleMapsRoute(lat, lng, origin);
      btn.disabled = false;
      btn.textContent = original;
    },
    () => {
      // GPS denied/unavailable — fall back to letting Google Maps use its own current-location default
      openGoogleMapsRoute(lat, lng);
      btn.disabled = false;
      btn.textContent = original;
    },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
  );
}

contentEl.addEventListener('click', (e) => {
  const star = e.target.closest('.favorite-btn');
  if (star) { toggleFavorite(star.dataset.favorite); return; }
  const btn = e.target.closest('.go-btn');
  if (btn) routeFromHere(btn);
});

function render() {
  const raw = searchEl.value.trim();
  clearEl.classList.toggle('show', raw.length > 0);
  const q = normalize(raw);
  const qNoZero = stripLeadingZeros(q);

  let results;
  if (!q) {
    results = [...WELLS];
    if (userLoc) {
      results.sort((a, b) => haversine(userLoc.lat, userLoc.lng, a.lat, a.lng) - haversine(userLoc.lat, userLoc.lng, b.lat, b.lng));
    } else if (!favoritesOnly) {
      results = results.slice(0, 30);
    }
    readoutEl.innerHTML = userLoc
      ? `Nearest sites to your location`
      : `Type a well ID or asset name — e.g. <b>CB20</b>`;
  } else {
    results = WELLS.filter(w => w._norm.includes(q) || w._normNoZero.includes(qNoZero));
    // prefix matches first
    results.sort((a, b) => {
      const aStarts = a._norm.startsWith(q) ? 0 : 1;
      const bStarts = b._norm.startsWith(q) ? 0 : 1;
      if (aStarts !== bStarts) return aStarts - bStarts;
      if (userLoc) return haversine(userLoc.lat, userLoc.lng, a.lat, a.lng) - haversine(userLoc.lat, userLoc.lng, b.lat, b.lng);
      return a.name.localeCompare(b.name);
    });
    readoutEl.innerHTML = results.length
      ? `<b>${results.length}</b> match${results.length === 1 ? '' : 'es'} for "${escapeHtml(raw)}"`
      : `No match for "${escapeHtml(raw)}"`;
  }

  if (favoritesOnly) results = results.filter(w => favorites.has(w.name));
  if (!results.length) {
    contentEl.innerHTML = `
      <div class="empty">
        <div class="big">🛰️</div>
        <div>No site found for "${escapeHtml(raw)}"</div>
        <div class="hint">Check spelling or try just part of the code</div>
      </div>`;
    return;
  }

  const label = q || favoritesOnly
    ? ''
    : `<div class="count-label">${userLoc ? 'NEAREST FIRST' : 'ALL SITES (first 30 — search to narrow)'}</div>`;
  contentEl.innerHTML = label + `<div class="results">${results.map(w => renderCard(w, raw)).join('')}</div>`;
}

searchEl.addEventListener('input', render);
clearEl.addEventListener('click', () => {
  searchEl.value = '';
  searchEl.focus();
  render();
});

locBtn.addEventListener('click', () => {
  if (!navigator.geolocation) {
    locStatus.textContent = 'GPS not available';
    return;
  }
  if (userLoc) {
    // toggle off
    userLoc = null;
    locBtn.classList.remove('active');
    gpsDot.classList.remove('on');
    locStatus.textContent = '';
    if (watchId) navigator.geolocation.clearWatch(watchId);
    render();
    return;
  }
  locStatus.textContent = 'Locating…';
  watchId = navigator.geolocation.watchPosition(
    pos => {
      userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      locBtn.classList.add('active');
      gpsDot.classList.add('on');
      locStatus.textContent = '';
      render();
    },
    err => {
      locStatus.textContent = 'GPS denied/unavailable';
    },
    { enableHighAccuracy: true, maximumAge: 5000 }
  );
});

render();

// ---------- Theme toggle (defaults to system preference) ----------
const themeBtn = document.getElementById('themeBtn');
const htmlEl = document.documentElement;
const themeColorMeta = document.getElementById('themeColorMeta');
const THEME_COLORS = { dark: '#0B0D10', light: '#EEF1F4' };

function applyTheme(mode) {
  if (mode === 'light') {
    htmlEl.setAttribute('data-theme', 'light');
    themeBtn.textContent = '☀️';
  } else {
    htmlEl.removeAttribute('data-theme');
    themeBtn.textContent = '🌙';
  }
  themeColorMeta.setAttribute('content', THEME_COLORS[mode]);
}

let currentTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
applyTheme(currentTheme);

themeBtn.addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(currentTheme);
});

// ---------- Add to Home Screen ----------
const installBtn = document.getElementById('installBtn');
const installModal = document.getElementById('installModal');
const installBody = document.getElementById('installBody');
const installClose = document.getElementById('installClose');

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

function showIOSInstructions() {
  installBody.innerHTML = `
    <div class="step"><div class="step-num">1</div><div>Tap the <span class="icon-inline">⬆️ Share</span> icon in Safari's toolbar</div></div>
    <div class="step"><div class="step-num">2</div><div>Scroll down and tap <b>"Add to Home Screen"</b></div></div>
    <div class="step"><div class="step-num">3</div><div>Tap <b>"Add"</b> — the CNRL map icon will appear on your home screen</div></div>
  `;
  installModal.classList.add('show');
}

function showAndroidFallbackInstructions() {
  installBody.innerHTML = `
    <div class="step"><div class="step-num">1</div><div>Tap the <span class="icon-inline">⋮</span> menu in Chrome (top right)</div></div>
    <div class="step"><div class="step-num">2</div><div>Tap <b>"Add to Home screen"</b> or <b>"Install app"</b></div></div>
    <div class="step"><div class="step-num">3</div><div>Confirm — the CNRL map icon will appear on your home screen</div></div>
  `;
  installModal.classList.add('show');
}

installBtn.addEventListener('click', async () => {
  if (isStandalone()) {
    installBody.innerHTML = `<div class="step"><div>You're already using the installed app 👍</div></div>`;
    installModal.classList.add('show');
    return;
  }
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    return;
  }
  if (isIOS()) {
    showIOSInstructions();
  } else {
    showAndroidFallbackInstructions();
  }
});

installClose.addEventListener('click', () => installModal.classList.remove('show'));
installModal.addEventListener('click', (e) => {
  if (e.target === installModal) installModal.classList.remove('show');
});

// ---------- Version check: compare running app vs the file currently deployed ----------
const APP_VERSION = "2026.11.24-7";
const updateBanner = document.getElementById('updateBanner');
const updateBtn = document.getElementById('updateBtn');
let updateAvailable = false;

async function checkForUpdate() {
  if (updateAvailable) return; // already showing, no need to keep checking
  try {
    const res = await fetch(location.pathname + '?_v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    const match = text.match(/APP_VERSION:\s*(.+?)\s*-->/);
    if (match && match[1] !== APP_VERSION) {
      updateAvailable = true;
      updateBanner.classList.add('show');
    }
  } catch (err) {
    // offline or no signal — fail silently, this is a field app
  }
}

updateBtn.addEventListener('click', () => {
  window.location.href = location.pathname + '?_v=' + Date.now();
});

// Check shortly after load, then periodically for long shifts
setTimeout(checkForUpdate, 3000);
setInterval(checkForUpdate, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkForUpdate();
});
</script>
